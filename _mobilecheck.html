<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>mobile check</title>
<style>
 body{margin:0;padding:6px;background:#dfe6ee;font-family:sans-serif;display:flex;gap:8px;align-items:flex-start}
 .col{display:flex;flex-direction:column;gap:4px}
 .cap{font-size:11px;color:#334155}
 iframe{width:390px;height:844px;border:0;background:#fff;display:block}
</style></head>
<body>
 <div class="col"><div class="cap">통합 대시보드 (390×844)</div><iframe id="a" src="./index.html#/overview"></iframe></div>
 <div class="col"><div class="cap">모두의 숲 과일 위탁 (390×844)</div><iframe id="b" src="./index.html#/forest"></iframe></div>
<script>
 function jump(id){
   var f=document.getElementById(id);
   f.addEventListener('load',function(){
     setTimeout(function(){
       try{
         var d=f.contentDocument;
         var h=Array.prototype.find.call(d.querySelectorAll('h2'),function(x){return x.textContent.indexOf('제철 과일')>-1;});
         if(h){ window.scrollTo(0,0); h.scrollIntoView({block:'start'}); }
       }catch(e){}
     },1800);
   });
 }
 jump('a'); jump('b');
</script>
</body></html>
